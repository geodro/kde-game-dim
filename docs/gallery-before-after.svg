<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Noto Sans, DejaVu Sans, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a5f9e"/><stop offset="1" stop-color="#7a4b8f"/>
    </linearGradient>
    <linearGradient id="game" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3742"/><stop offset="1" stop-color="#141a20"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0e1013"/>
  <text x="100" y="112" fill="#ffffff" font-size="58" font-weight="700">Everything but the game goes black</text>
  <text x="100" y="162" fill="#9aa0a6" font-size="30">Windowed and borderless games too — the trigger is “is this the game”, not “is it fullscreen”.</text>

  <!-- BEFORE -->
  <g>
    <rect x="90" y="250" width="660" height="400" rx="14" fill="url(#wall)"/>
    <rect x="118" y="278" width="200" height="120" rx="10" fill="#e8eaed" opacity="0.85"/>
    <rect x="560" y="286" width="160" height="150" rx="10" fill="#e8eaed" opacity="0.85"/>
    <rect x="118" y="500" width="170" height="110" rx="10" fill="#e8eaed" opacity="0.85"/>
    <rect x="90" y="608" width="660" height="42" fill="#1b1e20" opacity="0.9"/>
    <g fill="#c8ccd0" opacity="0.9"><rect x="112" y="620" width="18" height="18" rx="4"/><rect x="142" y="620" width="18" height="18" rx="4"/><rect x="172" y="620" width="18" height="18" rx="4"/></g>
    <rect x="250" y="340" width="340" height="215" rx="10" fill="url(#game)" stroke="#000" stroke-width="2"/>
    <g fill="#ffffff" opacity="0.9"><rect x="392" y="425" width="12" height="38" rx="5"/><rect x="379" y="438" width="38" height="12" rx="5"/><circle cx="470" cy="432" r="9"/><circle cx="489" cy="452" r="9"/><circle cx="451" cy="452" r="9"/></g>
    <text x="420" y="706" fill="#9aa0a6" font-size="28" text-anchor="middle">Before — the desktop pulls your eye</text>
  </g>

  <!-- AFTER -->
  <g>
    <rect x="850" y="250" width="660" height="400" rx="14" fill="#000000"/>
    <rect x="878" y="278" width="200" height="120" rx="10" fill="#e8eaed" opacity="0.10"/>
    <rect x="1320" y="286" width="160" height="150" rx="10" fill="#e8eaed" opacity="0.10"/>
    <rect x="878" y="500" width="170" height="110" rx="10" fill="#e8eaed" opacity="0.10"/>
    <rect x="850" y="608" width="660" height="42" fill="#1b1e20" opacity="0.12"/>
    <rect x="1010" y="340" width="340" height="215" rx="10" fill="url(#game)" stroke="#1d99f3" stroke-width="2"/>
    <g fill="#ffffff" opacity="0.95"><rect x="1152" y="425" width="12" height="38" rx="5"/><rect x="1139" y="438" width="38" height="12" rx="5"/><circle cx="1230" cy="432" r="9"/><circle cx="1249" cy="452" r="9"/><circle cx="1211" cy="452" r="9"/></g>
    <text x="1180" y="706" fill="#ffffff" font-size="28" text-anchor="middle">With Game Dim — only the game is lit</text>
  </g>

  <text x="800" y="800" fill="#5f6budge" font-size="0"> </text>
  <text x="800" y="806" fill="#6f767d" font-size="26" text-anchor="middle">Alt+Tab away and everything comes back instantly. Opacity, detection rules and panel behaviour are configurable.</text>
</svg>
