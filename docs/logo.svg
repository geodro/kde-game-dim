<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d20"/><stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fc8ff"/><stop offset="1" stop-color="#1d99f3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d99f3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1d99f3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- the desktop that goes dark: ghost windows + panel -->
  <g fill="#ffffff" opacity="0.07">
    <rect x="64" y="96" width="150" height="104" rx="12"/>
    <rect x="300" y="88" width="148" height="86" rx="12"/>
    <rect x="66" y="330" width="120" height="92" rx="12"/>
    <rect x="330" y="336" width="118" height="86" rx="12"/>
    <rect x="96" y="440" width="320" height="26" rx="10"/>
  </g>
  <ellipse cx="256" cy="262" rx="190" ry="150" fill="url(#glow)"/>
  <rect x="136" y="176" width="240" height="172" rx="20" fill="url(#scr)"/>
  <!-- gamepad -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="196" y="240" width="14" height="44" rx="6"/>
    <rect x="181" y="255" width="44" height="14" rx="6"/>
    <circle cx="300" cy="248" r="11"/><circle cx="322" cy="272" r="11"/><circle cx="278" cy="272" r="11"/>
  </g>
</svg>
